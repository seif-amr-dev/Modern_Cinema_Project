<div
  class="confirm-action"
>
  <div
    class="confirm-action__overlay"
    (click)="onBackdropClick($event)"
    (keydown.escape)="onCancel()"
  >
    <div
      class="confirm-action__panel"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-action-title"
    >
      <div class="confirm-action__icon" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="15" y1="9" x2="9" y2="15" />
          <line x1="9" y1="9" x2="15" y2="15" />
        </svg>
      </div>

      <h3 id="confirm-action-title" class="confirm-action__title">
        {{ title() }}
      </h3>

      <p class="confirm-action__message">
        {{ message() }}
      </p>

      @if (serverError(); as error) {
        <p class="confirm-action__error" role="alert">{{ error }}</p>
      }

      <div class="confirm-action__actions">
        <button
          type="button"
          class="confirm-action__button confirm-action__button--ghost"
          (click)="onCancel()"
          [disabled]="busy()"
          autofocus
        >
          Cancel
        </button>
        <button
          type="button"
          class="confirm-action__button"
          [class.confirm-action__button--danger]="variant() === 'danger'"
          [class.confirm-action__button--primary]="variant() === 'primary'"
          (click)="onConfirm()"
          [disabled]="busy()"
        >
          {{ busy() ? 'Working…' : confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
</div>
