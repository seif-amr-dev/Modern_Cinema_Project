<div class="cinema-overlay">
  <div class="auth-card">
    <div class="auth-header">
      <div class="glow-icon">🔒</div>
      <h2>Forgot Password</h2>
      <p>Enter your email to receive a password reset link.</p>
    </div>
    
    @if (errorMessage) {
      <div class="error-banner">
        ⚠️ {{ errorMessage }}
      </div>
    }

    @if (successMessage) {
      <div class="success-banner">
        ✅ {{ successMessage }}
      </div>
    }
    
    <form class="auth-form" [formGroup]="forgetForm" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <input type="email" id="email" formControlName="email" required placeholder=" " />
        <label for="email">Email Address</label>
      </div>
      
      <button type="submit" class="auth-btn" [disabled]="forgetForm.invalid || isLoading">
        <span>{{ isLoading ? 'Sending...' : 'Send Reset Link' }}</span>
        <div class="btn-glow"></div>
      </button>
    </form>

    <p class="auth-footer">
      Remember your password? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
