<div class="movie-card">

  <div
    class="poster-placeholder"
    [style.background-image]="'url(' + movie.poster.url + ')'"
  ></div>

  <div class="card-content">

    <h3>{{ movie.title }}</h3>

    <p>
      {{ movie.genre.join(' • ') }} • {{ movie.duration }} min
    </p>

    <div class="card-actions">

      <a
        class="details-btn"
        [routerLink]="['/movie', movie._id]"
      >
        View Details
      </a>

<button class="book-btn" [routerLink]="['/book', movie._id]">
  Book Tickets
</button>

    </div>

  </div>

</div>
