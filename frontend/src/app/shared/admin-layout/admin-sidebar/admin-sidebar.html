<aside class="admin-sidebar" [class.is-open]="isOpen()">

  <div class="admin-sidebar__brand">
    <span class="admin-sidebar__mark" aria-hidden="true"></span>
    <span class="admin-sidebar__name">Cinema Ops</span>
  </div>

  <span class="admin-sidebar__label">Main Operations</span>

  <nav class="admin-sidebar__nav" aria-label="Admin navigation">
    <a
      class="admin-sidebar__link"
      routerLink="/admin"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="close.emit()"
    >
      <span class="admin-sidebar__icon" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="7" height="9" rx="1" />
          <rect x="14" y="3" width="7" height="5" rx="1" />
          <rect x="14" y="12" width="7" height="9" rx="1" />
          <rect x="3" y="16" width="7" height="5" rx="1" />
        </svg>
      </span>
      <span class="admin-sidebar__text">Dashboard</span>
    </a>

    <a
      class="admin-sidebar__link"
      routerLink="/admin/users"
      routerLinkActive="is-active"
      (click)="close.emit()"
    >
      <span class="admin-sidebar__icon" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="9" cy="7" r="4" />
          <path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
        </svg>
      </span>
      <span class="admin-sidebar__text">Users</span>
    </a>

    <a
      class="admin-sidebar__link"
      routerLink="/admin/movies"
      routerLinkActive="is-active"
      (click)="close.emit()"
    >
      <span class="admin-sidebar__icon" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M7 4v16" />
          <path d="M17 4v16" />
          <path d="M3 9h18" />
          <path d="M3 15h18" />
        </svg>
      </span>
      <span class="admin-sidebar__text">Movies</span>
    </a>

    <a
      class="admin-sidebar__link"
      routerLink="/admin/showtimes"
      routerLinkActive="is-active"
      (click)="close.emit()"
    >
      <span class="admin-sidebar__icon" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
        </svg>
      </span>
      <span class="admin-sidebar__text">Showtimes</span>
    </a>

    <a
      class="admin-sidebar__link"
      routerLink="/admin/halls"
      routerLinkActive="is-active"
      (click)="close.emit()"
    >
      <span class="admin-sidebar__icon" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="2" y="4" width="20" height="14" rx="2" />
          <path d="M8 21h8" />
          <path d="M12 17v4" />
          <path d="M10 8v5l4-2.5V8l-4 0z" />
        </svg>
      </span>
      <span class="admin-sidebar__text">Halls</span>
    </a>
  </nav>

  <div class="admin-sidebar__footer">
    <button class="admin-sidebar__link admin-sidebar__logout" type="button" (click)="onLogout()">
      <span class="admin-sidebar__icon" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <path d="M16 17l5-5-5-5" />
          <path d="M21 12H9" />
        </svg>
      </span>
      <span class="admin-sidebar__text">Logout</span>
    </button>

    <div class="admin-sidebar__status">
      <span class="admin-sidebar__status-dot" aria-hidden="true"></span>
      <span class="admin-sidebar__status-text">Cluster 01 — Online</span>
    </div>
  </div>

</aside>
