<nav class="navbar">

  <a class="logo" routerLink="/">
    ModernCinema
  </a>

  <div class="nav-links">
    <a routerLink="/">Now Playing</a>
    @if (authService.isLoggedIn()) {
      
      <!-- Logged In View -->
      <div class="user-menu">
        <button class="user-badge" routerLink="/profile">👤 My Account</button>
        <button class="logout-btn" (click)="authService.logout()" routerLink="/login">
          Logout
        </button>
      </div>

    } @else {
      <a class="login-btn" routerLink="/login">
        Sign In
      </a>
      
    }
  </div>

</nav>
